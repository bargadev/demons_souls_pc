    Patch:
      - [be32, 0x018F0174, 0x44BC0000]   # R = 1504.0f
      - [be32, 0x00718CFC, 0x3D40C360]   # lis r10,0xC360  -> L = -224.0f
      - [be32, 0x00718D68, 0x914B0000]   # stw r10,0(r11)
