  "Aspect ratio (HUD/Menus) 32:9":
    Games:
      "Demon's Souls":
        BLUS30443: [01.00]
    Author: "Pierre"
    Patch Version: 1.0
    Group: "Aspect ratio (HUD/Menus)"
    Notes: "Requires the \"Aspect Ratio\" patch to be enabled as well as the \"Stretch To Display Area\" checked in the GPU settings. Centers HUD/menus by offsetting the UI quad while using the wider UI width."
    Patch:
      - [be32, 0x018F0174, 0x44F00000]   # R = 1920.0f
      - [be32, 0x00718CFC, 0x3D40C420]   # lis r10,0xC420  -> L = -640.0f
      - [be32, 0x00718D68, 0x914B0000]   # stw r10,0(r11)
